<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Space Shooter Game</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#030719;color:white;font-family:Arial;

display:flex;justify-content:center;min-height:100vh;padding:15px}

.game{width:100%;max-width:650px;background:#07142d;

border:2px solid #168dff;border-radius:16px;padding:15px}

.stats{display:flex;justify-content:space-between;

align-items:center;color:#65e5ff;font-weight:bold}

canvas{display:block;width:100%;background:#050b24;

border-radius:10px;margin-top:15px}

button{background:#075acb;color:white;border:0;

padding:12px 18px;border-radius:8px;font-size:16px}

.controls{display:flex;justify-content:center;gap:12px}

</style>

</head>

<body>

<div class="game">

<div class="stats">

<span>SCORE: <b id="score">0</b></span>

<span>LIVES: <b id="lives">3</b></span>

<button id="pause">Pause</button>

</div>

<canvas id="canvas" width="600" height="650"></canvas>

<div class="controls">

<button id="left"></button>

<button id="fire"> FIRE</button>

<button id="right"></button>

</div>

<p>Use arrow keys or buttons to move and fire.</p>

</div>



<script>

const canvas=document.getElementById('canvas');

const ctx=canvas.getContext('2d');

let ship={x:300,y:570};

let bullets=[],enemies=[],stars=[];

let score=0,lives=3,paused=false;

let keys={},lastShot=0,enemyTimer=0;

let leftTouch=false,rightTouch=false,fireTouch=false;



for(let i=0;i<100;i++){

stars.push({x:Math.random()*600,y:Math.random()*650,

s:Math.random()*2+1});

}



function spawnEnemy(){

enemies.push({

x:25+Math.random()*550,

y:-20,

speed:1.3+Math.random()*1.5

});

}



function shoot(){

let now=Date.now();

if(now-lastShot>230){

bullets.push({x:ship.x,y:ship.y-20});

lastShot=now;

}

}



function drawShip(){

ctx.fillStyle='#24c8ff';

ctx.beginPath();

ctx.moveTo(ship.x,ship.y-24);

ctx.lineTo(ship.x-22,ship.y+22);

ctx.lineTo(ship.x,ship.y+12);

ctx.lineTo(ship.x+22,ship.y+22);

ctx.closePath();

ctx.fill();

ctx.fillStyle='#fff';

ctx.fillRect(ship.x-4,ship.y-5,8,12);

}



function update(){

if(paused)return;



ctx.clearRect(0,0,600,650);

ctx.fillStyle='#b4d8ff';

stars.forEach(s=>{

s.y+=s.s;

if(s.y>650){s.y=0;s.x=Math.random()*600}

ctx.fillRect(s.x,s.y,2,2);

});



if(keys.ArrowLeft||keys.a||leftTouch)ship.x-=5;

if(keys.ArrowRight||keys.d||rightTouch)ship.x+=5;

if(keys[' ']||fireTouch)shoot();

ship.x=Math.max(25,Math.min(575,ship.x));



enemyTimer++;

if(enemyTimer>38){spawnEnemy();enemyTimer=0;}



drawShip();



bullets.forEach(b=>{

b.y-=8;

ctx.fillStyle='#3de9ff';

ctx.fillRect(b.x-3,b.y,6,15);

});

bullets=bullets.filter(b=>b.y>-20);



enemies.forEach(e=>{

e.y+=e.speed;

ctx.fillStyle='#ff415e';

ctx.beginPath();

ctx.moveTo(e.x,e.y-13);

ctx.lineTo(e.x-15,e.y+10);

ctx.lineTo(e.x,e.y+5);

ctx.lineTo(e.x+15,e.y+10);

ctx.closePath();

ctx.fill();



bullets.forEach(b=>{

if(Math.abs(b.x-e.x)<18&&Math.abs(b.y-e.y)<18){

e.y=900;

b.y=-50;

score+=100;

document.getElementById('score').textContent=score;

}

});



if(e.y>ship.y-20&&e.y<ship.y+25&&

Math.abs(e.x-ship.x)<28){

e.y=900;lives--;

document.getElementById('lives').textContent=lives;

}

if(e.y>650){e.y=900;}

});



enemies=enemies.filter(e=>e.y<700);

if(lives<=0){

paused=true;

ctx.fillStyle='white';

ctx.font='42px Arial';

ctx.fillText('GAME OVER',175,320);

ctx.font='22px Arial';

ctx.fillText('Score: '+score,240,360);

return;

}

requestAnimationFrame(update);

}



document.addEventListener('keydown',e=>{

keys[e.key]=true;

if(e.key===' ')e.preventDefault();

});

document.addEventListener('keyup',e=>keys[e.key]=false);



function hold(id,setter){

const el=document.getElementById(id);

el.addEventListener('pointerdown',e=>{e.preventDefault();setter(true)});

['pointerup','pointerleave','pointercancel'].forEach(ev=>

el.addEventListener(ev,()=>setter(false)));

}

hold('left',v=>leftTouch=v);

hold('right',v=>rightTouch=v);

hold('fire',v=>fireTouch=v);



document.getElementById('pause').onclick=()=>{

paused=!paused;

document.getElementById('pause').textContent=paused?'Resume':'Pause';

if(!paused)requestAnimationFrame(update);

};



update();

</script>

</body>

</html>
