<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Country Explorer</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#07152b;color:#f5f8ff;font-family:Arial;padding:22px}

main{max-width:1000px;margin:auto}

header{display:flex;justify-content:space-between;align-items:center}

form{display:flex;gap:10px;margin:20px 0}

input,button{padding:14px;border-radius:9px;font-size:16px}

input{flex:1;min-width:0;background:#102441;color:white;border:1px solid #294261}

button{background:#0867ef;color:white;border:0;cursor:pointer}

.card{background:#0d203a;border:1px solid #294261;border-radius:14px;padding:20px}

.country{display:grid;grid-template-columns:260px 1fr;gap:22px}

.flag{width:100%;border-radius:10px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}

.stat{background:#102a4b;padding:14px;border-radius:10px;overflow-wrap:anywhere}

.stat h3{font-size:17px}

.popular{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}

.popular button{background:#17385d}

#message{color:#8abfff}

@media(max-width:650px){

body{padding:12px}

.country{grid-template-columns:1fr}

.stats{grid-template-columns:repeat(2,1fr)}

}

</style>

</head>

<body>

<main>

<header>

<h1> Country Explorer</h1>

<span>Explore the world</span>

</header>



<form id="form">

<input id="search" placeholder="Search for a country..." value="Kenya">

<button>Search</button>

</form>



<div class="popular">

<button type="button" data-country="Kenya">Kenya</button>

<button type="button" data-country="Japan">Japan</button>

<button type="button" data-country="France">France</button>

<button type="button" data-country="Brazil">Brazil</button>

<button type="button" data-country="Australia">Australia</button>

</div>



<p id="message">Ready to explore.</p>

<section id="result"></section>

</main>



<script>

const form=document.getElementById('form');

const input=document.getElementById('search');

const message=document.getElementById('message');

const result=document.getElementById('result');



async function searchCountry(name){

name=name.trim();

if(!name)return;



message.textContent='Searching...';

result.innerHTML='';



try{

const response=await fetch(

'https://restcountries.com/v3.1/name/'+encodeURIComponent(name)

);

if(!response.ok)throw Error('Country not found');



const countries=await response.json();

const c=countries[0];



const languages=Object.values(c.languages||{}).join(', ')||'N/A';

const currencies=Object.values(c.currencies||{})

.map(x=>x.name+' ('+x.symbol+')').join(', ')||'N/A';

const capital=(c.capital||['N/A']).join(', ');

const population=Number(c.population).toLocaleString();

const area=Number(c.area).toLocaleString();



message.textContent='Country information loaded.';



result.innerHTML=`

<div class="card country">

<div>

<img class="flag" src="${c.flags.svg}" alt="Country flag">

<h2>${c.name.common}</h2>

<p>${c.name.official}</p>

</div>

<div>

<h2>Country Information</h2>

<div class="stats">

<div class="stat"> Population<h3>${population}</h3></div>

<div class="stat"> Capital<h3>${capital}</h3></div>

<div class="stat"> Region<h3>${c.region}</h3></div>

<div class="stat"> Currency<h3>${currencies}</h3></div>

<div class="stat"> Languages<h3>${languages}</h3></div>

<div class="stat"> Area<h3>${area} km²</h3></div>

<div class="stat"> Time Zone<h3>${(c.timezones||[]).join(', ')}</h3></div>

<div class="stat"> Government<h3>${c.independent?'Independent':'Other status'}</h3></div>

</div>

<h3>About ${c.name.common}</h3>

<p>${c.name.common} is located in ${c.region}, in ${c.continents.join(', ')}.</p>

<p>Subregion: ${c.subregion||'N/A'}</p>

<p>Driving side: ${c.car?.side||'N/A'}</p>

</div>

</div>`;

}catch(error){

message.textContent='Country not found. Check your spelling or try another country.';

}

}



form.addEventListener('submit',e=>{

e.preventDefault();

searchCountry(input.value);

});



document.querySelectorAll('[data-country]').forEach(button=>{

button.addEventListener('click',()=>{

input.value=button.dataset.country;

searchCountry(input.value);

});

});



searchCountry('Kenya');

</script>

</body>

</html>
